<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Engine - Multi-Bet & Lobby Edition</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0b0b0d; color: #ffffff; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; box-sizing: border-box; }

        #app-wrapper { display: flex; gap: 20px; width: 950px; height: 680px; }
        /* Left Side: Live Multiplayer Lobby list */
        #lobby-side { width: 320px; background-color: #14141a; border-radius: 16px; border: 1px solid #232329; display: flex; flex-direction: column; overflow: hidden; }
        .lobby-header { padding: 15px; border-bottom: 1px solid #232329; font-weight: bold; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px; color: #94a3b8; display: flex; justify-content: space-between; }
        #player-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .player-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; background-color: #0b0b0d; border-radius: 8px; border: 1px solid #1c1c22; transition: all 0.2s; }
        .player-info { display: flex; flex-direction: column; gap: 2px; }
        .player-name { font-size: 0.9rem; font-weight: 600; color: #e2e8f0; }
        .player-stake { font-size: 0.8rem; color: #64748b; }
        .player-status { font-size: 0.85rem; font-weight: bold; color: #64748b; padding: 3px 8px; border-radius: 6px; }
        .status-cashed { color: #121214; background-color: #f59e0b; box-shadow: 0 0 10px rgba(245, 158, 11, 0.2); }
        .status-flying { color: #f59e0b; }
        .status-lost { color: #ef4444; }

        /* Right Side: Primary Flight Canvas Deck and Dual Betting Cockpits */
        #flight-side { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        #game-container { background-color: #14141a; padding: 20px; border-radius: 16px; border: 1px solid #232329; flex: 1; display: flex; flex-direction: column; }

        #history-bar { display: flex; gap: 8px; overflow-x: auto; background-color: #0b0b0d; padding: 8px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #1c1c22; min-height: 24px; }
        .history-pill { padding: 4px 10px; border-radius: 12px; font-size: 0.85rem; font-weight: bold; background-color: #1e1e24; }
        .pill-low { color: #38bdf8; background-color: rgba(56, 189, 248, 0.12); }
        .pill-high { color: #c084fc; background-color: rgba(192, 132, 252, 0.12); }

        #radar-wrapper { position: relative; width: 100%; height: 200px; background-color: #0b0b0d; border-radius: 12px; border: 1px solid #1c1c22; margin-bottom: 12px; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #multiplier-display { position: absolute; width: 100%; top: 35%; left: 0; font-size: 4rem; font-weight: 900; pointer-events: none; z-index: 10; text-align: center; font-variant-numeric: tabular-nums; }
        .flying { color: #f59e0b; text-shadow: 0 0 25px rgba(245, 158, 11, 0.4); animation: pulseFlight 0.6s infinite alternate ease-in-out; }
        .crashed { color: #ef4444; text-shadow: 0 0 25px rgba(239, 68, 68, 0.4); animation: shakeCrash 0.4s ease-in-out; }

        #wallet-display { background-color: #1a1a24; padding: 10px 14px; border-radius: 8px; font-weight: bold; color: #10b981; font-size: 1.1rem; border-left: 4px solid #10b981; text-align: left; margin-bottom: 10px; }
        #status-row { display: flex; justify-content: space-between; align-items: center; }
        #status { font-size: 0.95rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; text-align: left; }
        .top-actions { display: flex; gap: 8px; align-items: center; }
        .sound-btn, .account-link { background-color: #1a1a24; color: #94a3b8; border: 1px solid #232329; border-radius: 6px; padding: 4px 10px; font-size: 0.8rem; font-weight: bold; cursor: pointer; text-decoration: none; }
        .sound-btn:hover, .account-link:hover { border-color: #f59e0b; }
        .account-link { color: #f59e0b; }

        /* Bottom Row: Dual Cockpit Columns */
        #cockpit-row { display: flex; gap: 15px; }
        .betting-pod { flex: 1; background-color: #14141a; border-radius: 16px; border: 1px solid #232329; padding: 15px; box-sizing: border-box; }

        /* Auto Config Section Styling */
        .auto-section { display: flex; flex-direction: column; gap: 8px; background-color: #0b0b0d; padding: 10px; border-radius: 8px; border: 1px solid #1c1c22; margin-bottom: 10px; }
        .toggle-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: bold; color: #94a3b8; }
        .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #29292e; transition: .2s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .2s; border-radius: 50%; }
        input:checked + .slider { background-color: #f59e0b; }
        input:checked + .slider:before { transform: translateX(14px); }

        .auto-inputs { display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; color: #64748b; margin-top: 4px; border-top: 1px solid #1c1c22; padding-top: 6px; }
        .auto-cash-input { width: 65px; padding: 4px; background-color: #14141a; border: 1px solid #232329; border-radius: 4px; color: white; text-align: center; font-size: 0.85rem; font-weight: bold; }

        /* Stake controls: minus, amount, plus */
        .stake-controls { display: flex; gap: 8px; margin-bottom: 8px; }
        input[type="number"].stake-field { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #232329; background-color: #0b0b0d; color: white; font-size: 1.1rem; text-align: center; font-weight: bold; }
        input[type="number"].stake-field:disabled { opacity: 0.6; }
        .step-btn { width: 48px; background-color: #232329; color: #ffffff; border: none; border-radius: 6px; font-size: 1.4rem; font-weight: bold; cursor: pointer; }
        .step-btn:hover:not(:disabled) { background-color: #2e2e36; }

        /* Quick amount chips */
        .quick-chips { display: flex; gap: 8px; margin-bottom: 10px; }
        .chip { flex: 1; padding: 6px; background-color: #1e1e24; color: #e2e8f0; border: 1px solid #232329; border-radius: 6px; font-weight: bold; font-size: 0.85rem; cursor: pointer; }
        .chip:hover:not(:disabled) { border-color: #f59e0b; }
        .step-btn:disabled, .chip:disabled { opacity: 0.35; cursor: not-allowed; }

        /* Main action button: a big label, with an optional small line under it */
        .btn { width: 100%; padding: 14px 10px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; transition: all 0.1s; line-height: 1.2; }
        .btn-main { display: block; }
        .btn-sub { display: block; font-size: 0.7rem; font-weight: normal; letter-spacing: 0.5px; text-transform: none; margin-top: 3px; opacity: 0.85; }
        .btn-bet { background-color: #ef4444; color: #ffffff; }
        .btn-bet:hover:not(:disabled) { background-color: #dc2626; }
        .btn-cancel { background-color: #dc2626; color: #ffffff; }
        .btn-cancel:hover:not(:disabled) { background-color: #b91c1c; }
        .btn-cashout { background-color: #f59e0b; color: #121214; font-size: 1.15rem; }
        .btn-cashout:hover:not(:disabled) { background-color: #d97706; }
        .btn-won { background: linear-gradient(180deg, #f59e0b, #d97706); color: #121214; box-shadow: 0 0 14px rgba(245, 158, 11, 0.35); cursor: default; }
        .btn-lost { background-color: #232329; color: #ef4444; cursor: default; }
        .btn-disabled, .btn:disabled { background-color: #232329; color: #4b5563; cursor: not-allowed; }

        /* Deposit / withdraw panel shown over the game */
        .hidden { display: none !important; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal-card { width: 340px; background: #14141a; border: 1px solid #232329; border-radius: 16px; padding: 22px; }
        .modal-head { display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: #f59e0b; font-size: 1.1rem; margin-bottom: 10px; }
        .modal-close { background: none; border: none; color: #94a3b8; font-size: 1.4rem; cursor: pointer; }
        .modal-balance { color: #10b981; font-weight: bold; margin-bottom: 12px; }
        .modal-seg { display: flex; background: #0b0b0d; border: 1px solid #232329; border-radius: 8px; padding: 3px; margin-bottom: 12px; }
        .modal-seg button { flex: 1; padding: 8px; background: none; border: none; color: #94a3b8; font-weight: bold; cursor: pointer; border-radius: 6px; }
        .modal-seg button.active { background: #f59e0b; color: #121214; }
        .modal-input { width: 100%; padding: 10px; background: #0b0b0d; border: 1px solid #232329; border-radius: 6px; color: #fff; font-size: 1rem; }
        .modal-quick { display: flex; gap: 6px; margin: 8px 0 12px; }
        .modal-quick button { flex: 1; padding: 6px; background: #1e1e24; color: #e2e8f0; border: 1px solid #232329; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .modal-submit { width: 100%; padding: 12px; background: #f59e0b; color: #121214; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .modal-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        .modal-msg { min-height: 20px; margin-top: 10px; font-size: 0.85rem; }
        .modal-msg.ok { color: #10b981; }
        .modal-msg.err { color: #ef4444; }
        .modal-note { margin-top: 10px; font-size: 0.75rem; color: #64748b; }

        @keyframes shakeCrash { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }
        @keyframes pulseFlight { 0% { transform: scale(1); } 100% { transform: scale(1.03); } }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <!-- LEFT SIDEBAR: Scrolling User Feed -->
        <div id="lobby-side">
            <div class="lobby-header">
                <span>All Bets</span>
                <span id="active-count" style="color:#f59e0b">0</span>
            </div>
            <div id="player-list">
                <!-- Peer player rows get injected here dynamically -->
            </div>
        </div>

        <!-- RIGHT SIDEBAR: Primary Flight Deck Workspace -->
        <div id="flight-side">
            <div id="game-container">
                <div id="history-bar"></div>

                    <canvas id="flightCanvas"></canvas>

            <!-- DUAL COCKPIT ROW CONTAINER -->

                </div>

                <!-- PANEL B -->
                <div class="betting-pod" id="pod-B">
                    <div class="auto-section">
                        <div class="toggle-row">
                            <span>Auto Bet</span>
                            <label class="switch"><input type="checkbox" id="autobet-B"><span class="slider"></span></label>
                        </div>
                        <div class="toggle-row" style="margin-top: 4px;">
                            <span>Auto Cash Out</span>
                            <label class="switch"><input type="checkbox" id="autocash-enable-B"><span class="slider"></span></label>
                        </div>
                        <div class="auto-inputs">
                            <span>Target Rate:</span>
                            <input type="number" id="autocash-val-B" class="auto-cash-input" value="1.50" step="0.1" min="1.01">
                        </div>
                    </div>
                    <div class="stake-controls">
                        <button class="step-btn" data-stake-id="B" data-delta="-10">−</button>
                        <input type="number" id="bet-amount-B" class="stake-field" value="10" min="1">
                        <button class="step-btn" data-stake-id="B" data-delta="10">+</button>
                    </div>
                    <div class="quick-chips">
                        <button class="chip" data-stake-id="B" data-amount="10">10</button>
                        <button class="chip" data-stake-id="B" data-amount="1000">1000</button>
                        <button class="chip" data-stake-id="B" data-amount="2500">2500</button>
                    </div>
                    <button id="action-btn-B" class="btn btn-disabled" disabled><span class="btn-main">WAITING</span></button>
                </div>
            </div>
        </div>
    </div>

    <!-- DEPOSIT / WITHDRAW PANEL (the flight keeps running behind it) -->
    <div id="money-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-head">
                <span>Deposit / Withdraw</span>
                <button id="money-close" class="modal-close">×</button>
            </div>
            <div class="modal-balance">Balance: <span id="money-balance">$0.00</span></div>
            <div class="modal-seg">
                <button id="money-mode-deposit" class="active">Deposit</button>
                <button id="money-mode-withdraw">Withdraw</button>
            </div>
            <input id="money-amount" class="modal-input" type="number" min="1" step="1" placeholder="Enter amount">
            <div class="modal-quick">
                <button data-quick="100">100</button>
                <button data-quick="500">500</button>
                <button data-quick="1000">1000</button>
                <button data-quick="5000">5000</button>
            </div>
            <button id="money-submit" class="modal-submit">Deposit</button>
            <div id="money-msg" class="modal-msg"></div>
            <div class="modal-note">Play money only.</div>
        </div>
    </div>

    <script>
        // Connects to the same server that serves this page
        const socket = io();

        // Login token saved by the dashboard page (same browser, same server)
        let token = localStorage.getItem("aviator_token");
        let loggedIn = false;
        let currentBalance = null;
        let currentMultiplier = 1.00;
        let flightState = "WAITING";

        // Each pod: state is one of
        //   idle       no bet
        //   placing    bet sent, waiting for the server
        //   queued     bet placed, waiting for take-off (can cancel)
        //   cancelling cancel sent, waiting for the server
        //   flying     bet is in the air (can cash out)
        //   cashing    cash out sent, waiting for the server
        //   won        cashed out; stays showing the win until the next round
        //   lost       crashed before cash out; stays until the next round
        let pods = {
            A: { state: "idle", stake: 0, won: 0 },
            B: { state: "idle", stake: 0, won: 0 }
        };

        let lobbyPlayers = [];
        // Pool of players' names from many countries. Names are picked at random each round. Repeats are fine: a player who keeps coming back is still a player.
        const NAME_POOL = [

            "Amina Otieno", "Brian Kipchoge", "Wanjiru Mwangi", "Kevin Mutua", "Faith Achieng", "Dennis Kamau",

            "Joyce Nyambura", "Felix Kimani", "Peter Mwenda", "Grace Akinyi",
            // Nigeria & Ghana
            "Chinedu Okafor", "Ngozi Eze", "Tunde Adeyemi", "Ifeoma Nwosu", "Emeka Obi", "Funke Balogun",
            "Kwame Mensah", "Akosua Boateng", "Kofi Asante", "Abena Owusu",
            // South Africa, Ethiopia, Uganda, Tanzania
            "Thabo Nkosi", "Lerato Molefe", "Sipho Dlamini", "Zanele Khumalo", "Abebe Tesfaye", "Helen Girma",
            "Moses Ssemakula", "Prossy Nakato", "Juma Mrisho", "Neema Mollel",
            // Egypt, Morocco, Middle East
            "Omar Hassan", "Layla Farouk", "Youssef Nasser", "Mariam Khalil", "Karim Saad", "Nour Benali",
            "Rami Haddad", "Yasmin Aziz",
            // South Asia
            "Arjun Patel", "Priya Sharma", "Rohan Mehta", "Ananya Iyer", "Vikram Singh", "Kavya Reddy",
            "Bilal Ahmed", "Ayesha Malik", "Sanjay Gupta", "Meera Nair",
            // East Asia
            "Wei Chen", "Mei Lin", "Jun Zhang", "Xiu Li", "Hao Wang", "Yan Liu",
            "Kenji Tanaka", "Yuki Sato", "Haruto Ito", "Sakura Kobayashi",
            "Min-jun Park", "Ji-woo Kim", "Seo-yeon Lee", "Hyun Choi",
            // Southeast Asia
            "Minh Nguyen", "Linh Tran", "Miguel Santos", "Angelica Reyes", "Budi Wijaya", "Sari Putri",
            // Latin America
            "Lucas Oliveira", "Ana Souza", "Gabriel Costa", "Beatriz Lima", "Sofia Hernandez", "Carlos Ramirez",
            "Valentina Torres", "Diego Morales", "Lucia Fernandez", "Javier Ortiz",
            // Western Europe
            "Louis Martin", "Chloe Dubois", "Hugo Laurent", "Camille Moreau", "Lukas Schmidt", "Hannah Weber",
            "Felix Hoffmann", "Marco Rossi", "Giulia Bianchi", "Alessandro Conti", "Daan de Jong", "Lars Jensen",
            // Eastern & Northern Europe, Turkey, Greece
            "Ivan Petrov", "Olga Smirnova", "Dmitri Kuznetsov", "Piotr Nowak", "Zofia Kowalska",
            "Emre Yilmaz", "Elif Demir", "Nikos Papadopoulos", "Eleni Georgiou", "Erik Lindqvist", "Ingrid Solberg",
            // UK, US, Canada, Australia
            "Oliver Brooks", "Ava Mitchell", "Ethan Walker", "Megan Hughes", "Marcus Johnson", "Tanisha Williams",
            "Connor Murphy", "Darius Green", "Noah Foster", "Jacob Reed", "Olivia Clarke", "Liam Campbell"
        ];


        const walletDiv = document.getElementById("wallet-display");
        const statusDiv = document.getElementById("status");
        const multiplierDiv = document.getElementById("multiplier-display");
        const playerListContainer = document.getElementById("player-list");
        const activeCountSpan = document.getElementById("active-count");
        const historyBar = document.getElementById("history-bar");
        const soundToggle = document.getElementById("sound-toggle");
        const accountLink = document.getElementById("account-link");
        const moneyBtn = document.getElementById("money-btn");

        const canvas = document.getElementById("flightCanvas");
        const ctx = canvas.getContext("2d");
        function resizeCanvas() { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; }
        resizeCanvas();

        /* ---------- ACCOUNT ---------- */
        function updateWalletUI() {
            walletDiv.innerText = loggedIn && currentBalance !== null
                ? `Wallet Balance: $${currentBalance.toFixed(2)}`
                : "Guest: watch only. Log in to play.";
        }

        function setLoggedOut() {
            token = null;
            loggedIn = false;
            currentBalance = null;
            try { localStorage.removeItem("aviator_token"); } catch (e) {}
            accountLink.innerText = "Log in";
            moneyBtn.style.display = "none";
            document.getElementById("money-modal").classList.add("hidden");
            accountLink.href = "dashboard_accounts.html";
            updateWalletUI();
            renderAllPods();
        }

        function setLoggedIn(username) {
            loggedIn = true;
            accountLink.innerText = username;
            moneyBtn.style.display = "";
            accountLink.href = "dashboard_accounts.html";
            renderAllPods();
        }

        if (token) {
            fetch("/api/me", { headers: { Authorization: "Bearer " + token } })
                .then(r => r.ok ? r.json() : Promise.reject())
                .then(u => { setLoggedIn(u.username); currentBalance = u.balance; updateWalletUI(); })
                .catch(() => setLoggedOut());
        } else {
            setLoggedOut();
        }

        socket.on("connect", () => {
            if (token) socket.emit("auth", token);
        });
        socket.on("auth_failed", () => setLoggedOut());
        socket.on("balance_update", (data) => {
            currentBalance = data.balance;
            updateWalletUI();
        });

        /* ---------- SOUND (synthesized with Web Audio, no files needed) ---------- */
        let soundOn = true;
        let audioCtx = null;
        let engineNodes = null;   // non-null while the flight music is playing
        let musicTimer = null;
        let nextNoteTime = 0;
        let noteIndex = 0;

        function getAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === "suspended") audioCtx.resume();
            return audioCtx;
        }

        // Every sound passes through one master volume. Muting sets it to 0 at once, so nothing already queued can be heard.
        let masterGain = null;
        function masterOut() {
            const ac = getAudio();
            if (!masterGain) {
                masterGain = ac.createGain();
                masterGain.gain.value = soundOn ? 1 : 0;
                masterGain.connect(ac.destination);
            }
            return masterGain;
        }
        function setMuted(muted) {
            if (masterGain) masterGain.gain.value = muted ? 0 : 1;
        }
        // Browsers only allow sound after the user clicks or taps once
        document.addEventListener("pointerdown", () => { try { getAudio(); } catch (e) {} }, { once: true });

        // Plays one note at an exact time on the audio clock
        function playNoteAt(t, freq, type, dur, vol) {
            const ac = getAudio();
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.exponentialRampToValueAtTime(vol, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            osc.connect(gain);
            gain.connect(masterOut());
            osc.start(t);
            osc.stop(t + dur + 0.05);
        }

        function playTone(freq, type, duration, volume, delay = 0, endFreq = null) {
            if (!soundOn) return;
            const ac = getAudio();
            const t = ac.currentTime + delay;
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t);
            if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t + duration);
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.exponentialRampToValueAtTime(volume, t + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
            osc.connect(gain);
            gain.connect(masterOut());
            osc.start(t);
            osc.stop(t + duration + 0.05);
        }

        // Flight music: a bouncy bassline, a kick on each beat and a melody that repeats.
        // The tempo rises as the multiplier grows.
        const NOTES = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25]; // C major
        const MELODY = [0, 2, 4, 2, 5, 4, 2, -1,  1, 3, 5, 3, 4, 2, 0, -1];            // -1 = rest
        const BASS = [130.81, 98.00, 110.00, 123.47];                                    // C, G, A, B

        function scheduleEighth(t, i) {
            const ac = getAudio();
            const step = i % 16;

            const mel = MELODY[step];
            if (mel >= 0) playNoteAt(t, NOTES[mel], "triangle", 0.3, 0.09);

            if (step % 4 === 0) {
                playNoteAt(t, BASS[Math.floor(i / 16) % BASS.length], "sine", 0.45, 0.14);

                // Kick drum: a short falling tone
                const osc = ac.createOscillator();
                const gain = ac.createGain();
                osc.frequency.setValueAtTime(140, t);
                osc.frequency.exponentialRampToValueAtTime(45, t + 0.12);
                gain.gain.setValueAtTime(0.3, t);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
                osc.connect(gain);
                gain.connect(masterOut());
                osc.start(t);
                osc.stop(t + 0.16);
            }
        }

        function musicTick() {
            if (!engineNodes || !audioCtx) return;
            while (nextNoteTime < audioCtx.currentTime + 0.15) {
                scheduleEighth(nextNoteTime, noteIndex);
                const beat = 60 / (100 + Math.min(currentMultiplier, 10) * 8);
                nextNoteTime += beat / 2;
                noteIndex++;
            }
        }

        function startEngine() {
            if (!soundOn || engineNodes) return;
            getAudio();
            engineNodes = {};
            nextNoteTime = audioCtx.currentTime + 0.05;
            noteIndex = 0;
            musicTimer = setInterval(musicTick, 25);
            musicTick();
        }

        function stopEngine() {
            if (!engineNodes) return;
            clearInterval(musicTimer);
            musicTimer = null;
            engineNodes = null;
        }

        function playBetSound() { playTone(520, "square", 0.06, 0.06); }

        // Applause: a crowd swell with many hand claps scattered over about two seconds
        function playApplause() {
            if (!soundOn) return;
            const ac = getAudio();
            const t0 = ac.currentTime;

            // Crowd murmur swelling up and fading out
            const crowdLen = Math.floor(ac.sampleRate * 2.2);
            const cb = ac.createBuffer(1, crowdLen, ac.sampleRate);
            const cd = cb.getChannelData(0);
            for (let i = 0; i < crowdLen; i++) cd[i] = Math.random() * 2 - 1;
            const crowd = ac.createBufferSource();
            crowd.buffer = cb;
            const crowdFilter = ac.createBiquadFilter();
            crowdFilter.type = "bandpass";
            crowdFilter.frequency.value = 1000;
            crowdFilter.Q.value = 0.6;
            const crowdGain = ac.createGain();
            crowdGain.gain.setValueAtTime(0.0001, t0);
            crowdGain.gain.exponentialRampToValueAtTime(0.18, t0 + 0.4);
            crowdGain.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.2);
            crowd.connect(crowdFilter);
            crowdFilter.connect(crowdGain);
            crowdGain.connect(masterOut());
            crowd.start(t0);
            crowd.stop(t0 + 2.3);

            // Individual hand claps, denser at the start
            const clapLen = Math.floor(ac.sampleRate * 0.06);
            const kb = ac.createBuffer(1, clapLen, ac.sampleRate);
            const kd = kb.getChannelData(0);
            for (let i = 0; i < clapLen; i++) kd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / clapLen, 3);
            for (let k = 0; k < 70; k++) {
                const t = t0 + Math.pow(Math.random(), 1.6) * 1.8;
                const src = ac.createBufferSource();
                src.buffer = kb;
                const bp = ac.createBiquadFilter();
                bp.type = "bandpass";
                bp.frequency.value = 1500 + Math.random() * 1500;
                bp.Q.value = 1.0;
                const g = ac.createGain();
                g.gain.value = 0.25 + Math.random() * 0.35;
                src.connect(bp);
                bp.connect(g);
                g.connect(masterOut());
                src.start(t);
            }
        }

        // Happy win jingle: a quick bright run up the scale, then a major chord that rings out with a bell on top
        function playJoy() {
            if (!soundOn) return;
            const ac = getAudio();
            const t0 = ac.currentTime + 0.02;
            const run = [523.25, 659.25, 783.99, 987.77, 1046.5, 1318.51, 1567.98];
            run.forEach((f, i) => playNoteAt(t0 + i * 0.07, f, "triangle", 0.22, 0.16));

            const chordT = t0 + run.length * 0.07;
            [523.25, 659.25, 783.99, 1046.5].forEach(f => playNoteAt(chordT, f, "sine", 1.1, 0.12));
            playNoteAt(chordT, 2093, "sine", 0.6, 0.06);
        }

        // Crash: a noise burst that falls away, with a low thud
        function playCrashSound() {
            if (!soundOn) return;
            const ac = getAudio();
            const len = Math.floor(ac.sampleRate * 0.9);
            const buf = ac.createBuffer(1, len, ac.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
            const src = ac.createBufferSource();
            src.buffer = buf;
            const filt = ac.createBiquadFilter();
            filt.type = "lowpass";
            filt.frequency.setValueAtTime(1200, ac.currentTime);
            filt.frequency.exponentialRampToValueAtTime(120, ac.currentTime + 0.9);
            const g = ac.createGain();
            g.gain.value = 0.7;
            src.connect(filt);
            filt.connect(g);
            g.connect(masterOut());
            src.start();
            playTone(150, "sine", 0.7, 0.5, 0, 40);
        }

        soundToggle.addEventListener("click", () => {
            soundOn = !soundOn;
            soundToggle.innerText = soundOn ? "Sound: On" : "Sound: Off";
            setMuted(!soundOn);
            if (!soundOn) stopEngine();
            else if (flightState === "IN_PROGRESS") startEngine();
        });

        /* ---------- STAKE CONTROLS ---------- */
        function setStakeLocked(id, locked) {
            const input = document.getElementById(`bet-amount-${id}`);
            if (locked) input.setAttribute("disabled", "true");
            else input.removeAttribute("disabled");
            document.querySelectorAll(`[data-stake-id="${id}"]`).forEach(c => { c.disabled = locked; });
        }

        function adjustStake(id, delta) {
            const input = document.getElementById(`bet-amount-${id}`);
            if (input.disabled) return;
            let v = parseFloat(input.value) || 0;
            v = Math.max(1, Math.round((v + delta) * 100) / 100);
            input.value = v;
        }

        function setStakeAmount(id, amount) {
            const input = document.getElementById(`bet-amount-${id}`);
            if (input.disabled) return;
            input.value = amount;
        }

        document.querySelectorAll(".step-btn").forEach(b =>
            b.addEventListener("click", () => adjustStake(b.dataset.stakeId, Number(b.dataset.delta))));
        document.querySelectorAll(".chip").forEach(c =>
            c.addEventListener("click", () => setStakeAmount(c.dataset.stakeId, Number(c.dataset.amount))));

        /* ---------- POD BUTTONS ---------- */
        // Writes the main label and optional small line under it
        function setButton(id, main, sub, cls, enabled) {
            const btn = document.getElementById(`action-btn-${id}`);
            btn.className = "btn " + cls;
            btn.innerHTML = `<span class="btn-main">${main}</span>` + (sub ? `<span class="btn-sub">${sub}</span>` : "");
            btn.disabled = !enabled;
        }

        function renderPod(id) {
            const p = pods[id];
            const inFlight = flightState === "IN_PROGRESS" || flightState === "CRASHED";
            setStakeLocked(id, p.state !== "idle");

            switch (p.state) {
                case "idle":
                    if (!loggedIn) setButton(id, "LOG IN TO PLAY", "", "btn-bet", true);
                    else setButton(id, "PLACE BET", inFlight ? "Joins next round" : "", "btn-bet", true);
                    break;
                case "placing":
                    setButton(id, "PLACING...", "", "btn-disabled", false);
                    break;
                case "queued":
                    setButton(id, "CANCEL", "Waiting", "btn-cancel", true);
                    break;
                case "cancelling":
                    setButton(id, "CANCELLING...", "", "btn-disabled", false);
                    break;
                case "flying": {
                    // Only change the amount text, so the button element stays put and clicks always land
                    const btn = document.getElementById(`action-btn-${id}`);
                    const label = btn.querySelector(".btn-main");
                    const amountText = `CASH OUT ($${(p.stake * currentMultiplier).toFixed(2)})`;
                    if (btn.classList.contains("btn-cashout") && label) {
                        label.innerText = amountText;
                        btn.disabled = false;
                    } else {
                        setButton(id, amountText, "", "btn-cashout", true);
                    }
                    break;
                }
                case "cashing":
                    setButton(id, "CASHING OUT...", "", "btn-disabled", false);
                    break;
                case "won":
                    setButton(id, `WON $${p.won.toFixed(2)}`, "", "btn-won", false);
                    break;
                case "lost":
                    setButton(id, "LOST", `-$${p.stake.toFixed(2)}`, "btn-lost", false);
                    break;
            }
        }

        function renderAllPods() {
            ["A", "B"].forEach(renderPod);
        }

        function setupPod(id) {
            document.getElementById(`action-btn-${id}`).addEventListener("click", () => {
                // Guests are sent to the login page
                if (!loggedIn) { window.location.href = "dashboard_accounts.html"; return; }

                const p = pods[id];
                if (p.state === "idle") placeBet(id, false);
                else if (p.state === "queued") cancelBet(id);
                else if (p.state === "flying") cashOut(id);
            });
        }
        setupPod("A"); setupPod("B");

        /* ---------- ACTIONS (the server decides everything; these only send requests) ---------- */
        function placeBet(id, silent) {
            if (!loggedIn || pods[id].state !== "idle") return;
            const amount = parseFloat(document.getElementById(`bet-amount-${id}`).value);

            if (!(amount > 0)) { if (!silent) alert("Enter a valid amount."); return; }
            if (currentBalance !== null && amount > currentBalance) {
                if (!silent) alert(`Insufficient balance for Pod ${id}!`);
                return;
            }

            pods[id].state = "placing";
            pods[id].stake = amount;
            socket.emit("place_bet", { amount: amount, pod: id });
            renderPod(id);
            playBetSound();
        }

        function cancelBet(id) {
            if (pods[id].state !== "queued") return;
            pods[id].state = "cancelling";
            socket.emit("cancel_bet", { pod: id });
            renderPod(id);
        }

        // Shows the win straight away, then the server confirms the exact amount
        function cashOut(id) {
            if (pods[id].state !== "flying") return;
            const estimate = Math.round(pods[id].stake * currentMultiplier * 100) / 100;
            showWon(id, estimate);
            playApplause();
            // Send the multiplier on screen, so the server pays exactly what the player saw
            socket.emit("cash_out", { pod: id, multiplier: currentMultiplier });
        }

        // Shows the win for a few seconds, then the pod goes back to PLACE BET
        function showWon(id, amount) {
            const p = pods[id];
            clearTimeout(p.timer);
            p.state = "won";
            p.won = amount;
            p.timer = setTimeout(() => {
                if (pods[id].state === "won") {
                    pods[id] = { state: "idle", stake: 0, won: 0 };
                    renderPod(id);
                }
            }, 3000);
            renderPod(id);
        }

        function processAutomatedBets(id) {
            const autoChecked = document.getElementById(`autobet-${id}`).checked;
            if (loggedIn && autoChecked && flightState === "WAITING" && pods[id].state === "idle") {
                placeBet(id, true);
            }
        }

        function processAutomatedCashouts(id, rate) {
            const autoCashChecked = document.getElementById(`autocash-enable-${id}`).checked;
            const targetRate = parseFloat(document.getElementById(`autocash-val-${id}`).value);
            if (autoCashChecked && pods[id].state === "flying" && rate >= targetRate) {
                cashOut(id);
            }
        }

        /* ---------- GAME UI ---------- */
        function seedLobbyPlayers() {
            playerListContainer.innerHTML = "";
            lobbyPlayers = [];
            let rCount = Math.floor(Math.random() * 5) + 6;
            const picks = Array.from({ length: rCount }, () => NAME_POOL[Math.floor(Math.random() * NAME_POOL.length)]);

            for (let i = 0; i < rCount; i++) {
                const [first, last] = picks[i].split(" ");
                let name = `${first} ${last.charAt(0)}.***`;
                let stake = Math.floor(Math.random() * 45) + 5;
                let botTarget = Math.round((1.1 + Math.random() * 4.5) * 100) / 100;

                let row = document.createElement("div");
                row.className = "player-row";
                row.id = `bot-${i}`;
                row.innerHTML = `
                    <div class="player-info">
                        <span class="player-name">${name}</span>
                        <span class="player-stake">$${stake.toFixed(2)}</span>
                    </div>
                    <span class="player-status status-flying" id="bot-status-${i}">Flying...</span>
                `;
                playerListContainer.appendChild(row);
                lobbyPlayers.push({ id: i, elementStatus: document.getElementById(`bot-status-${i}`), targetRate: botTarget, stake: stake, active: true });
            }
            activeCountSpan.innerText = rCount;
        }

        function checkLobbyPayouts(rate) {
            lobbyPlayers.forEach(bot => {
                if (bot.active && rate >= bot.targetRate) {
                    bot.active = false;
                    bot.elementStatus.className = "player-status status-cashed";
                    bot.elementStatus.innerText = `$${(bot.stake * bot.targetRate).toFixed(2)}`;
                }
            });
        }

        function finalizeLobbyLosses() {
            lobbyPlayers.forEach(bot => {
                if (bot.active) {
                    bot.active = false;
                    bot.elementStatus.className = "player-status status-lost";
                    bot.elementStatus.innerText = "Busted";
                }
            });
        }

        // Graph loop: started once, keeps running for the life of the page
        let flightProgress = 0;
        function drawGraph() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#14141a"; ctx.lineWidth = 1;
            for (let i = 40; i < canvas.width; i += 40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
            for (let i = 40; i < canvas.height; i += 40) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke(); }

            if (flightState === "IN_PROGRESS") {
                flightProgress += 1.5;
                let startX = 30; let startY = canvas.height - 30;
                let currentX = startX + (flightProgress * 0.8);
                let currentY = startY - Math.pow(flightProgress * 0.22, 1.5);

                if (currentX > canvas.width - 40) currentX = canvas.width - 40;
                if (currentY < 40) currentY = 40;

                ctx.beginPath(); ctx.moveTo(startX, startY);
                ctx.quadraticCurveTo(startX + (currentX - startX) * 0.5, startY, currentX, currentY);
                ctx.strokeStyle = "#f59e0b"; ctx.lineWidth = 4; ctx.stroke();

                ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(currentX, currentY, 6, 0, Math.PI * 2); ctx.fill();
            }
            requestAnimationFrame(drawGraph);
        }
        requestAnimationFrame(drawGraph);

        /* ---------- SERVER REPLIES ---------- */
        socket.on("my_bets", (mine) => {
            ["A", "B"].forEach(id => {
                const bet = mine[id];
                if (bet) {
                    pods[id] = { state: bet.flying ? "flying" : "queued", stake: bet.stake, won: 0 };
                } else if (pods[id].state === "queued" || pods[id].state === "flying") {
                    pods[id] = { state: "idle", stake: 0, won: 0 };
                }
                renderPod(id);
            });
        });

        socket.on("bet_confirmed", (data) => {
            pods[data.pod].state = "queued";
            pods[data.pod].stake = data.amount;
            renderPod(data.pod);
        });

        socket.on("bet_rejected", (data) => {
            pods[data.pod] = { state: "idle", stake: 0, won: 0 };
            renderPod(data.pod);
            alert(data.reason);
        });

        socket.on("bet_cancelled", (data) => {
            pods[data.pod] = { state: "idle", stake: 0, won: 0 };
            renderPod(data.pod);
        });

        socket.on("cancel_rejected", (data) => {
            pods[data.pod].state = data.flying ? "flying" : "idle";
            renderPod(data.pod);
            alert(data.reason);
        });

        socket.on("cash_out_success", (data) => {
            const id = data.pod;
            statusDiv.innerText = `CASHED OUT AT ${data.multiplier.toFixed(2)}x`;
            statusDiv.style.color = "#10b981";
            // Replace the estimate with the exact amount the server paid (only if the win is still showing)
            if (pods[id].state === "won") {
                pods[id].won = data.winnings;
                renderPod(id);
            }
        });

        // The cash out did not go through (the plane had already crashed). Go straight back to PLACE BET.
        socket.on("cash_out_rejected", (data) => {
            const id = data.pod;
            clearTimeout(pods[id].timer);
            pods[id] = { state: "idle", stake: 0, won: 0 };
            renderPod(id);
        });

        socket.on("game_state", (data) => {
            flightState = data.state;

            if (data.state === "WAITING") {
                stopEngine();
                flightProgress = 0;
                statusDiv.innerText = "PLACING BETS...";
                statusDiv.style.color = "#ef4444";
                multiplierDiv.innerText = "1.00x";
                multiplierDiv.className = "flying";

                seedLobbyPlayers();

                ["A", "B"].forEach(id => {
                    // Bets already queued stay queued. Finished pods clear for the new round.
                    if (pods[id].state !== "queued") pods[id] = { state: "idle", stake: 0, won: 0 };
                    processAutomatedBets(id);
                    renderPod(id);
                });
            }
            else if (data.state === "IN_PROGRESS") {
                startEngine();
                // Every queued bet has now taken off
                ["A", "B"].forEach(id => {
                    if (pods[id].state === "queued") pods[id].state = "flying";
                    renderPod(id);
                });
            }
            else if (data.state === "CRASHED") {
                stopEngine();
                playCrashSound();
                statusDiv.innerText = "FLEW AWAY!";
                statusDiv.style.color = "#ef4444";
                multiplierDiv.innerText = data.finalMultiplier.toFixed(2) + "x";
                multiplierDiv.className = "crashed";

                finalizeLobbyLosses();

                ["A", "B"].forEach(id => {
                    // A bet that crashed goes straight back to PLACE BET, with no loss message.
                    // Queued bets stay queued for the next flight.
                    if (pods[id].state === "flying") pods[id] = { state: "idle", stake: 0, won: 0 };
                    renderPod(id);
                });

                const pill = document.createElement("div");
                pill.className = `history-pill ${data.finalMultiplier >= 2.00 ? 'pill-high' : 'pill-low'}`;
                pill.innerText = data.finalMultiplier.toFixed(2) + "x";
                historyBar.insertBefore(pill, historyBar.firstChild);
                if (historyBar.children.length > 10) historyBar.removeChild(historyBar.lastChild);
            }
        });

        socket.on("multiplier_update", (data) => {
            currentMultiplier = parseFloat(data.multiplier);
            if (isNaN(currentMultiplier)) currentMultiplier = 1.00;

            multiplierDiv.innerText = currentMultiplier.toFixed(2) + "x";
            statusDiv.innerText = "PLANE IS FLYING";
            statusDiv.style.color = "#f59e0b";

            checkLobbyPayouts(currentMultiplier);

            ["A", "B"].forEach(id => {
                processAutomatedCashouts(id, currentMultiplier);
                // Refresh the live cash-out amount
                if (pods[id].state === "flying") renderPod(id);
            });
        });

        /* ---------- DEPOSIT / WITHDRAW PANEL ---------- */
        // Lives on the game page, so the flight keeps running while the player deposits or withdraws
        const moneyModal = document.getElementById("money-modal");
        const moneyAmount = document.getElementById("money-amount");
        const moneySubmit = document.getElementById("money-submit");
        const moneyMsg = document.getElementById("money-msg");
        const moneyBalanceEl = document.getElementById("money-balance");
        let moneyMode = "deposit";

        function showMoneyMsg(text, ok) {
            moneyMsg.innerText = text;
            moneyMsg.className = "modal-msg " + (ok ? "ok" : "err");
        }

        function setMoneyMode(mode) {
            moneyMode = mode;
            document.getElementById("money-mode-deposit").classList.toggle("active", mode === "deposit");
            document.getElementById("money-mode-withdraw").classList.toggle("active", mode === "withdraw");
            moneySubmit.innerText = mode === "deposit" ? "Deposit" : "Withdraw";
            showMoneyMsg("", true);
        }

        function openMoney() {
            if (!loggedIn) return;
            moneyBalanceEl.innerText = currentBalance !== null ? `$${currentBalance.toFixed(2)}` : "...";
            showMoneyMsg("", true);
            moneyModal.classList.remove("hidden");
            moneyAmount.focus();
        }

        function closeMoney() {
            moneyModal.classList.add("hidden");
        }

        moneyBtn.addEventListener("click", openMoney);
        document.getElementById("money-close").addEventListener("click", closeMoney);
        moneyModal.addEventListener("click", (e) => { if (e.target === moneyModal) closeMoney(); });
        document.getElementById("money-mode-deposit").addEventListener("click", () => setMoneyMode("deposit"));
        document.getElementById("money-mode-withdraw").addEventListener("click", () => setMoneyMode("withdraw"));
        document.querySelectorAll(".modal-quick button").forEach(b =>
            b.addEventListener("click", () => { moneyAmount.value = b.dataset.quick; }));

        moneySubmit.addEventListener("click", async () => {
            const amount = parseFloat(moneyAmount.value);
            if (!(amount > 0)) { showMoneyMsg("Enter an amount first.", false); return; }

            moneySubmit.disabled = true;
            try {
                const res = await fetch(`/api/${moneyMode}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
                    body: JSON.stringify({ amount: amount })
                });
                const data = await res.json().catch(() => ({}));

                if (res.status === 401) {
                    setLoggedOut();
                    showMoneyMsg("Please log in again.", false);
                } else if (!res.ok) {
                    showMoneyMsg(data.error || "Request failed.", false);
                } else {
                    currentBalance = data.balance;
                    updateWalletUI();
                    moneyBalanceEl.innerText = `$${data.balance.toFixed(2)}`;
                    showMoneyMsg(`${moneyMode === "deposit" ? "Added" : "Withdrew"} $${amount.toFixed(2)}.`, true);
                    moneyAmount.value = "";
                }
            } catch (err) {
                showMoneyMsg("Could not reach the server.", false);
            } finally {
                moneySubmit.disabled = false;
            }
        });

        renderAllPods();
    </script>
</body>
</html>
